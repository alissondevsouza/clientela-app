# Orquestração de PRODUÇÃO (landing + captura de lead + CRM autenticado).
# Domínios: DOMAIN (landing, raiz + www) e CRM_DOMAIN (gestao.*) — ADR-0017.
#
# Exposição pública: nenhuma porta publicada aqui. O proxy da VPS (Caddy do
# repositório infra-vps, projeto `plataforma`, ADR-0028) é o único com 80/443 e
# alcança só o web, pela rede externa `clientela-edge` (alias `clientela-web`).
# API e Postgres ficam apenas na rede interna do compose — o browser nunca fala
# com a API nem com o banco (security.md). A API é consumida só pelo web (server action).
#
# Envs obrigatórias usam ${VAR:?...}: o compose falha explícito se faltarem.
# Copie .env.production.example para .env e preencha antes de subir. Na VPS, use
# o script ./compose da pasta: ele passa a tag do último deploy (.image-tag).
name: clientela

services:
  # Next.js standalone servido por Node. Envs de RUNTIME via environment (a
  # server action de lead valida o schema completo em runtime).
  web:
    # Modelo pull (produção, ADR-0011): o deploy puxa a imagem do GHCR pela tag
    # exata (IMAGE_TAG=sha-<curto>). O `build:` abaixo coexiste — o compose usa
    # `image` no `pull`/`up` e `build` só quando se pede `build` (smoke local).
    # GHCR_OWNER vem do .env da VPS (${...:?} = falha explícita se ausente).
    image: "ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER no .env}/clientela-web:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Envs de BUILD (SSG/metadata). Não-segredo — persistem em docker history.
        SITE_URL: "${SITE_URL:?defina SITE_URL no .env}"
        API_URL: "${API_URL:?defina API_URL no .env (ex. http://api:3001)}"
        WHATSAPP_PHONE: "${WHATSAPP_PHONE:?defina WHATSAPP_PHONE no .env}"
        WHATSAPP_DEFAULT_MESSAGE: "${WHATSAPP_DEFAULT_MESSAGE:-}"
    restart: unless-stopped
    environment:
      SITE_URL: "${SITE_URL:?defina SITE_URL no .env}"
      API_URL: "${API_URL:?defina API_URL no .env (ex. http://api:3001)}"
      WHATSAPP_PHONE: "${WHATSAPP_PHONE:?defina WHATSAPP_PHONE no .env}"
      WHATSAPP_DEFAULT_MESSAGE: "${WHATSAPP_DEFAULT_MESSAGE:-}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      internal: {}
      # Rede de borda criada pelo proxy da VPS. O alias é único na VPS: o
      # Compose põe o nome do serviço (`web`) como alias em toda rede, e o
      # Gizito também tem um `web` (ADR-0028).
      clientela-edge:
        aliases:
          - clientela-web

  # API Bun/Elysia. Sem porta publicada: acessível só como `api:3001` na rede.
  api:
    image: "ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER no .env}/clientela-api:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?defina DATABASE_URL no .env (host interno postgres)}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3001/health'); if (!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  # Postgres 18 (uuidv7 nativo — ADR-0007). Sem porta publicada; volume nomeado
  # em /var/lib/postgresql (convenção 18+). POSTGRES_PASSWORD obrigatória.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientela}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (obrigatoria, sem default)}"
      POSTGRES_DB: ${POSTGRES_DB:-clientela}
    volumes:
      - clientela_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientela} -d ${POSTGRES_DB:-clientela}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Job de migração (RF-03): NÃO sobe com `up` (profile tools). Rodar com
  # `docker compose run --rm migrate` antes de subir a API. Só usa DATABASE_URL.
  migrate:
    image: "ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER no .env}/clientela-migrate:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    profiles: ["tools"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?defina DATABASE_URL no .env (host interno postgres)}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
  clientela-edge:
    name: clientela-edge
    external: true

volumes:
  clientela_pg_data:
