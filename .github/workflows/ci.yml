name: CI

# Pipeline de qualidade: lint + typecheck + testes (unidade e integração com
# Testcontainers — os runners do GitHub têm Docker, então a suíte roda de verdade).
#
# Dispara em push de qualquer branch EXCETO main e em pull requests. O
# `workflow_call` permite que o deploy.yml reuse ESTE mesmo pipeline como um job
# (`uses: ./.github/workflows/ci.yml`), garantindo "CI verde DESTE commit antes
# de publicar" sem duplicar os steps (DRY).
#
# ACOPLAMENTO COM deploy.yml (importante): a main NÃO dispara este workflow
# diretamente (`branches-ignore: [main]`) — na main o CI roda como o job `ci` do
# deploy.yml. Se o deploy.yml for desabilitado/removido, a main deixa de ter CI:
# nesse caso, religue o deploy ou remova o `branches-ignore: [main]` daqui.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

# Permissões mínimas: só leitura do conteúdo, o suficiente para o checkout.
permissions:
  contents: read

# Cancela runs obsoletos por ref (push/PR reenviado) para não desperdiçar runner.
# EXCEÇÃO main: a única forma de este workflow ver `refs/heads/main` é sendo
# reusado pelo deploy.yml (o push direto na main é ignorado acima). Nesse caso
# NÃO cancelamos — cancelar a CI de um deploy em andamento deixaria o deploy sem
# seu gate. Fora da main, cancelar duplicatas é seguro e desejável.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Versão fixada = builds reprodutíveis (mesma versão do dev local).
          bun-version: 1.3.11

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Testes
        run: bun run test
